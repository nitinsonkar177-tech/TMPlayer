name: Lite build

# Builds and tests the app module only (no desktop, no site). Writes Telegram credentials from
# the repository secrets when they exist; without them the APK still compiles (the app then
# cannot sign in, which is fine for a pipeline check).
on:
  push:
    branches: [main, "lite-*"]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Test and build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write Telegram credentials (when the secrets exist)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -n "$TG_API_ID" ]; then
            printf 'TG_API_ID=%s\nTG_API_HASH=%s\n' "$TG_API_ID" "$TG_API_HASH" > local.properties
          fi

      - name: Run core and ui tests
        run: ./gradlew :core:jvmTest :ui:jvmTest

      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK (universal)
        run: ./gradlew :app:assembleRelease -PtmVersionName=1.27.1-lite -PtmVersionCode=12401

      - name: Shred credentials
        if: always()
        run: rm -f local.properties

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-lite-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lite-test-results
          path: |
            core/build/reports/tests/
            ui/build/reports/tests/
            app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
